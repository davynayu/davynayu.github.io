    <title>我的书房</title>
    <style>
        body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 700px; margin: 0 auto; padding: 40px 20px; line-height: 1.8; color: #333; }
        .book { border-bottom: 1px solid #eee; padding: 30px 0; }
        .rating { color: #e67e22; font-size: 18px; }
        .date { color: #999; font-size: 14px; }
        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
    </style>
</head>
<body>
    <h1>📚 我的书房</h1>
    <p>记录我读过的每一本书。</p>

    <div class="book">
        <h2>《活着》 — 余华</h2>
        <div class="rating">⭐⭐⭐⭐⭐</div>
        <div class="date">2026年9月读完</div>
        <p>这本书让我重新思考"活着"本身的意义。福贵的一生充满苦难，但余华的笔触冷静而克制，没有煽情，却更让人动容。</p>
        <p><strong>适合谁：</strong>觉得生活艰难，需要 perspective 的人。</p>
    </div>

    <div class="book">
        <h2>《三体》 — 刘慈欣</h2>
        <div class="rating">⭐⭐⭐⭐</div>
        <div class="date">2026年8月读完</div>
        <p>宇宙尺度的黑暗森林法则，想象力磅礴。人物塑造稍弱，但概念足够震撼。</p>
    </div>
